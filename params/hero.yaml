#####═══════════════════════════════════════════════════════════════════════
##### ⭐⭐ 原则：**源代码以同济为准，本项目的东西只算「可选优化」**
#####
##### 所以 yaml 里每一项都是：
#####   · 默认值 = 同济行为（不写这一项就是同济）
#####   · 我们的优化 = 显式写出才生效，且**随时可以删掉回到同济**
#####
##### 想完全回到同济行为：把下面「优化开关」整段注释掉即可。
#####═══════════════════════════════════════════════════════════════════════

#####----- 优化开关（注释掉整段 = 完全同济行为）-----#####
# trajectory_impl: table     # 弹道：table=我们的查表(RK4精度+ideal速度)；同济=ideal(不写即可)
# armor_filter:              # 射击过滤：同济只有「颜色过滤」
#   skip_names: ["five", "outpost"]
#   use_invincible: true
#   use_auto_aim_target: false
# priority_mode: 3           # 目标优先级 4 张表；同济的 tracker 从不设 priority
# nis_chi2_q95: false        # EKF 一致性阈值：true=χ²(4) 95%分位(9.4877)；同济=0.711

enemy_color: "red"
# enemy_color: "blue"

#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: GPU     # ⭐ 同济原值；本机无 GPU → 靠 W28 的 device 回退自动降级到 CPU
min_confidence: 0.8

#####----- ⭐ W76：检测阈值（两关【串联】，有效阈值 = 更严的那个）-----#####
#  ① score_threshold：YOLO 解析时 objectness 的门槛（低于它 → 连候选都没有）
#  ② min_confidence ：check_name 里的门槛（过了 ① 还要过它，否则被删）
#  ⚠️ 默认 0.7 / 0.8 是【同济原值】；不写这两项 = 完全同济行为。
#  ⭐ 调试「objectness 上不去」时可把 score_threshold 调低（如 0.3）
#     以便看清"最高能到多少" —— 只会多出候选，不会改变已通过的判定。
# score_threshold: 0.7
# nms_threshold: 0.3
use_traditional: true

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree
min_confidence: 0.8

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: -2 # degree -2.5
pitch_offset: 0 # degree 2
comming_angle: 60 # degree
leaving_angle: 20 # degree
decision_speed: 8 # rad/s
high_speed_delay_time: 0.015 # s
low_speed_delay_time: 0.015 # s

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

# ⭐⭐ 相机配置以 `params/camera.yaml`（4 兵种共用）为默认，这里的同名项【覆盖】它。
camera_name: "hikrobot"
exposure_ms: 2
gain: 16
vid_pid: "2bdf:0001"
# ⭐⭐ W58：目标帧率。150 fps @1440x1080 Bayer8 ≈ 233 MB/s（接近 USB3 上限）
#   若报 0x80000007（无数据）→ 先降到 30 试（≈47 MB/s，肯定够）
fps: 30

# ⭐⭐ W90：**相机参数（不用开 MVS 每次调）** —— 通用通道，任意海康参数都能设。
#   名字必须与 **MVS 客户端里显示的一致**。先用 `--dump-camera-params` 打印当前值，
#   在 MVS 里调好之后，把好用的值抄进来即可。
#
#   camera_params:
#     float:                      # MV_CC_SetFloatValue
#       Gamma: 1.0
#       Sharpness: 50
#       # ExposureTime: 6000     # 单位 µs（也能覆盖上面的 exposure_ms）
#       # BalanceRatio: 1024
#     enum:                       # MV_CC_SetEnumValue
#       BalanceWhiteAuto: 0       # ⭐ 0=Off 1=Once 2=Continuous（默认是 2，会漂）
#       # GammaSelector: 1
#     int:                        # MV_CC_SetIntValue
#       # Width: 1280
#       # Height: 720


#  1  0  0
#  0  1  0
#  0  0  1

R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

# 重投影误差: 0.3145px
camera_matrix: [1851.7070167840545, 0, 721.12585328714192, 0, 1851.8175594364079, 571.69879709276688, 0, 0, 1]
distort_coeffs: [-0.093662536083526302, 0.18945726820633155, -0.00040424349861928674, -0.0040568403852123142, 0]

# 相机同理想情况的偏角: yaw-1.61 pitch-0.82 roll-0.61 degree
R_camera2gimbal: [0.02823004230930648, -0.014076983590428133, 0.99950232778328707, -0.99954530259354468, -0.010995644138609872, 0.028076393521179785, 0.010594940981141165, -0.99984045444409364, -0.014380990321749998]
t_camera2gimbal: [0.045517325957791413, 0.10544338092767802, 0.034649710880185793]

#####-----cboard参数-----#####
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"

#####-----gimbal参数-----#####
com_port: "/dev/gimbal"

#####-----planner-----#####
fire_thresh: 0.003

max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e6,0]
R_pitch: [1]

#####-----buff_detector参数-----#####
model: "assets/yolo11_buff_int8.xml"

#####-----buff_aimer参数-----#####
fire_gap_time: 0.520   # s
predict_time: 0.100     # s
