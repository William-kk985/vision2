# ⭐ 步兵相机配置（从 params/infantry.yaml 挪过来的）
#
# 优先级（低→高）：cameras/hikrobot.yaml < 本文件 < params/infantry.yaml 的相机段
#   ⇒ 兵种 yaml 里已经【不写相机参数了】，全在这里。
#
# ⚠️ 标定参数 `camera_matrix` / `distort_coeffs` 仍留在 `params/infantry.yaml` 里
#   （它们和镜头绑定，不是相机运行参数）。

camera_name: "hikrobot"        # ⭐ 品牌由这里决定 → 会自动加载 cameras/hikrobot.yaml
vid_pid: "2bdf:0001"

# ── 核心三项 ──
exposure_ms: 10                # 曝光（ms）—— ⚠️ 画面暗就先加这个
gain: 16                       # 增益（dB）
fps: 30                        # 帧率

# ── 通用海康参数（可选；名字与 MVS 里一致）──
# camera_params:
#   enum:
#     BalanceWhiteAuto: 0      # ⭐ 关自动白平衡（避免颜色漂）
#     # PixelFormat: 17301512  # BayerRG8
#   float:
#     # Gamma: 1.0
