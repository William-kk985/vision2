#####═══════════════════════════════════════════════════════════════════════
##### ⭐⭐ 原则：**源代码以同济为准，本项目的东西只算「可选优化」**
#####
##### 所以 yaml 里每一项都是：
#####   · 默认值 = 同济行为（不写这一项就是同济）
#####   · 我们的优化 = 显式写出才生效，且**随时可以删掉回到同济**
#####
##### 想完全回到同济行为：把下面「优化开关」整段注释掉即可。
#####═══════════════════════════════════════════════════════════════════════

#####----- 优化开关（注释掉整段 = 完全同济行为）-----#####
# trajectory_impl: table     # 弹道：table=我们的查表(RK4精度+ideal速度)；同济=ideal(不写即可)
# armor_filter:              # 射击过滤：同济只有「颜色过滤」
#   skip_names: ["five", "outpost"]
#   use_invincible: true
#   use_auto_aim_target: false
# priority_mode: 3           # 目标优先级 4 张表；同济的 tracker 从不设 priority
# nis_chi2_q95: false        # EKF 一致性阈值：true=χ²(4) 95%分位(9.4877)；同济=0.711

# enemy_color: "red"
enemy_color: "blue"


#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: GPU
min_confidence: 0.8

#####----- ⭐ W76：检测阈值（两关【串联】，有效阈值 = 更严的那个）-----#####
#  ① score_threshold：YOLO 解析时 objectness 的门槛（低于它 → 连候选都没有）
#  ② min_confidence ：check_name 里的门槛（过了 ① 还要过它，否则被删）
#  ⚠️ 默认 0.7 / 0.8 是【同济原值】；不写这两项 = 完全同济行为。
#  ⭐ 调试「objectness 上不去」时可把 score_threshold 调低（如 0.3）
#     以便看清"最高能到多少" —— 只会多出候选，不会改变已通过的判定。
# score_threshold: 0.7
# nms_threshold: 0.3
use_traditional: true

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----USB相机参数-----#####
image_width: 1280
image_height: 720
fov_h: 57.7 #87.7
fov_v: 56.7 
new_fov_h: 27 #67
new_fov_v: 40.9
usb_frame_rate: 120
usb_exposure: 500 #1-80000______250

#####-----工业相机参数-----#####

# ⭐⭐ W90：**相机参数（不用开 MVS 每次调）** —— 通用通道，任意海康参数都能设。
#   名字必须与 **MVS 客户端里显示的一致**。先用 `--dump-camera-params` 打印当前值，
#   在 MVS 里调好之后，把好用的值抄进来即可。
#
#     float:                      # MV_CC_SetFloatValue
#       Gamma: 1.0
#       Sharpness: 50
#       # ExposureTime: 6000     # 单位 µs（也能覆盖上面的 exposure_ms）
#     enum:                       # MV_CC_SetEnumValue
#       BalanceWhiteAuto: 0       # ⭐ 0=Off 1=Once 2=Continuous（默认是 2，会漂）
#     int:                        # MV_CC_SetIntValue
#       # Width: 1280


#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree
min_confidence: 0.8

#####-----cboard参数-----#####
quaternion_canid: 0x01
bullet_speed_canid: 0x110
send_canid: 0xff
can_interface: "can0"

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 25
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: -0.8 # degree -2.5
pitch_offset: -1  # degree 2
comming_angle: 60 # degree
leaving_angle: 20 # degree
left_yaw_offset: -1
right_yaw_offset: -0.6
decision_speed: 10 # rad/s
high_speed_delay_time: 0.026 # s
low_speed_delay_time: 0.010 # s

#####-----shooter参数-----#####
first_tolerance: 5 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 3 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

#####-----decider参数-----#####
mode: 1

#####-----工业相机标定参数-----#####
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

camera_config: "params/cameras/sentry.yaml"   # ⭐ 相机参数都在这（兵种 yaml 不再堆相机键）
# 重投影误差: 0.1833px

camera_matrix: [2414.9359264386621, 0, 717.26243105567414, 0, 2418.0489262208148, 582.68540529942845, 0, 0, 1]
distort_coeffs: [-0.0209453389287673, 0.15028138841073832, -0.0006517722113234505, -0.0016861906197686788, 0]

# 相机同理想情况的偏角: yaw-1.11 pitch0.01 roll-0.06 degree
# 标定板到世界坐标系原点的水平距离: 1.20 m
# 标定板同竖直摆放时的偏角: yaw123.89 pitch14.05 roll-0.86 degree
R_camera2gimbal: [0.01928451708725664, 0.00012696140743255463, 0.99981402834802846, -0.99981344688553653, -0.0010834913551969569, 0.019284643459122196, 0.0010857382619952124, -0.99999940496346484, 0.00010604311483339372]
t_camera2gimbal: [0.13089617453251859, 0.0038468007459533785, 0.094139945222010288]
