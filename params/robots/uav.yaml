#####═══════════════════════════════════════════════════════════════════════
##### ⭐⭐ 原则：**源代码以同济为准，本项目的东西只算「可选优化」**
#####
##### 所以 yaml 里每一项都是：
#####   · 默认值 = 同济行为（不写这一项就是同济）
#####   · 我们的优化 = 显式写出才生效，且**随时可以删掉回到同济**
#####
##### 想完全回到同济行为：把下面「优化开关」整段注释掉即可。
#####═══════════════════════════════════════════════════════════════════════

#####----- 优化开关（注释掉整段 = 完全同济行为）-----#####
# trajectory_impl: table     # 弹道：table=我们的查表(RK4精度+ideal速度)；同济=ideal(不写即可)
# armor_filter:              # 射击过滤：同济只有「颜色过滤」
#   skip_names: ["five", "outpost"]
#   use_invincible: true
#   use_auto_aim_target: false
# priority_mode: 3           # 目标优先级 4 张表；同济的 tracker 从不设 priority
# nis_chi2_q95: false        # EKF 一致性阈值：true=χ²(4) 95%分位(9.4877)；同济=0.711

enemy_color: "red"
# enemy_color: "blue"


#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: GPU     # ⭐ 同济原值；本机无 GPU → 靠 W28 的 device 回退自动降级到 CPU
min_confidence: 0.8

#####----- ⭐ W76：检测阈值（两关【串联】，有效阈值 = 更严的那个）-----#####
#  ① score_threshold：YOLO 解析时 objectness 的门槛（低于它 → 连候选都没有）
#  ② min_confidence ：check_name 里的门槛（过了 ① 还要过它，否则被删）
#  ⚠️ 默认 0.7 / 0.8 是【同济原值】；不写这两项 = 完全同济行为。
#  ⭐ 调试「objectness 上不去」时可把 score_threshold 调低（如 0.3）
#     以便看清"最高能到多少" —— 只会多出候选，不会改变已通过的判定。
# score_threshold: 0.7
# nms_threshold: 0.3
use_traditional: true

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----工业相机参数-----#####

#   uav 用的是 `mindvision`，参数请改 `gamma` / `exposure_ms`，
#   或参考 drivers/mindvision/mindvision.cpp 里的 set_* 调用自行扩展。

#####-----USB相机参数-----#####
image_width: 640
image_height: 360
new_image_width: 1280
new_image_height: 720
fov_h: 87.7
fov_v: 56.7 
new_fov_h: 67
new_fov_v: 40.9
usb_frame_rate: 100
usb_exposure: 315 #1-80000______250


#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree
min_confidence: 0.8

#####-----cboard参数-----#####
quaternion_canid: 0x001
bullet_speed_canid: 0x110
send_canid: 0xff
can_interface: "can0"

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 150

#####-----aimer参数-----#####
yaw_offset: 0 # degree -2.5
pitch_offset: 1.5 # degree 2
comming_angle: 70 # degree
leaving_angle: 30 # degree
min_spin_speed: 2 # rad/s
decision_speed: 12 # rad/s
high_speed_delay_time: 0.005 # s
low_speed_delay_time: 0.005 # s

#####-----decider参数-----#####
mode: 1

#####-----shooter参数-----#####
first_tolerance: 2 # 近距离射击容差，degree
second_tolerance: 0.8 # 远距离射击容差，degree
judge_distance: 0.5 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

#####-----工业相机标定参数-----#####
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

camera_config: "params/cameras/uav.yaml"   # ⭐ 相机参数都在这（兵种 yaml 不再堆相机键）
# 重投影误差: 0.1032px

camera_matrix: [2924.6190997571712, 0, 647.0245571651617, 0, 2927.4258594148396, 388.18625585771758, 0, 0, 1]
distort_coeffs: [-0.58886594170687334, 0.32512251112647716, 0.012447953238733123, -0.0032411418907421475, 0]
# 相机同理想情况的偏角: yaw0.02 pitch1.94 roll1.40 degree
# 标定板到世界坐标系原点的水平距离: 4.12 m
# 标定板同竖直摆放时的偏角: yaw-87.29 pitch7.65 roll-0.51 degree
R_camera2gimbal: [0.00046423063676173171, 0.033770528223625203, 0.99942950522456209, -0.99970300483287733, 0.024367462669785803, -0.00035901413901253575, -0.02436568525675643, -0.99913251282626891, 0.03377181066266309]
t_camera2gimbal: [-0.034955523715399906, -0.000074403211899371, 0.001248173910106823]


#####-----buff_detector参数-----#####
model: "assets/yolo11_buff_int8.xml"

#####-----buff_aimer参数-----#####
fire_gap_time: 0.600   # s
predict_time: 0.090     # s